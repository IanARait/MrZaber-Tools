<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern scientific calculator with keyboard support, memory functions, and calculation history.">
  <title>Scientific Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <a href="../index.html" class="back-btn" aria-label="Back to portfolio">
        <i class="fas fa-arrow-left"></i>
      </a>
      <h1 class="title">Scientific Calculator</h1>
      <button class="history-btn" id="historyToggle" aria-label="Toggle calculation history">
        <i class="fas fa-history"></i>
      </button>
    </header>

    <main class="calculator">
      <div class="display" id="display">
        <div class="display-expression" id="expression"></div>
        <div class="display-result" id="result">0</div>
      </div>

      <div class="memory-row">
        <button class="btn btn-memory" data-action="mc">MC</button>
        <button class="btn btn-memory" data-action="mr">MR</button>
        <button class="btn btn-memory" data-action="m-plus">M+</button>
        <button class="btn btn-memory" data-action="m-minus">M-</button>
      </div>

      <div class="buttons" id="buttons">
        <button class="btn btn-function" data-action="clear">C</button>
        <button class="btn btn-function" data-action="clear-entry">CE</button>
        <button class="btn btn-function" data-action="backspace"><i class="fas fa-delete-left"></i></button>
        <button class="btn btn-operator" data-action="divide"><i class="fas fa-divide"></i></button>

        <button class="btn btn-function" data-action="x-squared">x²</button>
        <button class="btn btn-function" data-action="x-cubed">x³</button>
        <button class="btn btn-function" data-action="pow">x<sup>y</sup></button>
        <button class="btn btn-operator" data-action="multiply"><i class="fas fa-xmark"></i></button>

        <button class="btn btn-function" data-action="sin">sin</button>
        <button class="btn btn-function" data-action="cos">cos</button>
        <button class="btn btn-function" data-action="tan">tan</button>
        <button class="btn btn-operator" data-action="subtract"><i class="fas fa-minus"></i></button>

        <button class="btn btn-function" data-action="log">log</button>
        <button class="btn btn-function" data-action="ln">ln</button>
        <button class="btn btn-function" data-action="sqrt">√</button>
        <button class="btn btn-operator" data-action="add"><i class="fas fa-plus"></i></button>

        <button class="btn btn-function" data-action="factorial">x!</button>
        <button class="btn btn-function" data-action="reciprocal">1/x</button>
        <button class="btn btn-function" data-action="abs">|x|</button>
        <button class="btn btn-function" data-action="exp">e<sup>x</sup></button>

        <button class="btn btn-function" data-action="paren-open">(</button>
        <button class="btn btn-function" data-action="paren-close">)</button>
        <button class="btn btn-function" data-action="pi">π</button>
        <button class="btn btn-function" data-action="euler">e</button>

        <button class="btn btn-number" data-value="7">7</button>
        <button class="btn btn-number" data-value="8">8</button>
        <button class="btn btn-number" data-value="9">9</button>
        <button class="btn btn-function" data-action="percent">%</button>

        <button class="btn btn-number" data-value="4">4</button>
        <button class="btn btn-number" data-value="5">5</button>
        <button class="btn btn-number" data-value="6">6</button>
        <button class="btn btn-operator" data-action="equals"><i class="fas fa-equals"></i></button>

        <button class="btn btn-number" data-value="1">1</button>
        <button class="btn btn-number" data-value="2">2</button>
        <button class="btn btn-number" data-value="3">3</button>
        <button class="btn btn-number zero" data-value="0">0</button>
        <button class="btn btn-number" data-value=".">.</button>
      </div>
    </main>

    <aside class="history-panel" id="historyPanel">
      <div class="history-header">
        <h2>History</h2>
        <button id="clearHistory" class="btn btn-small">Clear All</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </aside>
  </div>

  <div class="overlay" id="overlay"></div>
  <i class="fas fa-grip-lines handle"></i>
  <script src="script.js" defer></script>
</body>
</html>
