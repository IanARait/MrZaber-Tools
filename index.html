<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MrZaber Tools</title>
<style>
  :root{
    --bg:#0f1216;
    --surface:#171b21;
    --border:#2a303a;
    --ink:#e8eaed;
    --muted:#8a93a0;
    --accent:#5b8def;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:56px 20px 64px;
    display:flex; flex-direction:column; align-items:center;
  }
  h1{ font-size:28px; font-weight:700; letter-spacing:-0.02em; margin:0 0 6px; text-align:center; }
  .sub{ max-width:480px; text-align:center; color:var(--muted); font-size:15px; line-height:1.6; margin:14px auto 44px; }
  .cards{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;
    width:100%; max-width:720px;
  }
  @media (max-width:600px){ .cards{ grid-template-columns:repeat(2, 1fr);} }
  a.card{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:22px 16px; text-align:center; text-decoration:none; color:var(--ink);
    display:flex; flex-direction:column; align-items:center; gap:8px;
    transition:border-color .15s ease;
  }
  a.card:hover{ border-color:var(--accent); }
  a.card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .icon{ font-size:30px; line-height:1; }
  .name{ font-size:15px; font-weight:600; letter-spacing:-0.01em; }
  .tag{ font-size:12px; color:var(--muted); }
  footer{ margin-top:48px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
  <h1>MrZaber Tools</h1>
  <p class="sub">Five handy little tools. Pick one and use it.</p>
  <div class="cards">
    <a class="card" href="calculator/">
      <div class="icon">&#10133;</div>
      <div class="name">Calculator</div>
      <div class="tag">do the math</div>
    </a>
    <a class="card" href="weather-app/">
      <div class="icon">&#9925;</div>
      <div class="name">Weather App</div>
      <div class="tag">check the forecast</div>
    </a>
    <a class="card" href="todo-app/">
      <div class="icon">&#9745;</div>
      <div class="name">To-Do List</div>
      <div class="tag">track your tasks</div>
    </a>
    <a class="card" href="password-generator/">
      <div class="icon">&#9881;</div>
      <div class="name">Password Generator</div>
      <div class="tag">strong passwords</div>
    </a>
    <a class="card" href="quote-generator/">
      <div class="icon">&#10077;</div>
      <div class="name">Quote Generator</div>
      <div class="tag">random inspiration</div>
    </a>
  </div>
  <footer>MrZaber Tools &#183; 5 tools, no downloads</footer>
</body>
</html>
