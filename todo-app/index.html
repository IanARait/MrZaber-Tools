<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A full-featured To-Do List application with drag and drop, categories, due dates, and progress tracking.">
  <title>To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <nav class="top-nav">
      <a href="https://ianarait.github.io/EDIT-IAN_PORTFOLIO/" class="back-btn" aria-label="Back to portfolio">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </nav>

    <header class="app-header">
      <div class="header-left">
        <h1><i class="fas fa-check-circle"></i> To-Do List</h1>
        <p class="task-count"><span id="taskCounter">0</span> tasks</p>
      </div>
    </header>

    <section class="add-task-section" aria-label="Add new task">
      <form id="taskForm" class="task-form">
        <div class="form-row">
          <div class="input-group">
            <input type="text" id="taskInput" placeholder="What do you need to do?" required autocomplete="off">
          </div>
          <div class="input-group">
            <select id="categorySelect">
              <option value="Personal">Personal</option>
              <option value="Work">Work</option>
              <option value="Shopping">Shopping</option>
              <option value="Health">Health</option>
            </select>
          </div>
          <div class="input-group">
            <input type="date" id="dueDateInput">
          </div>
          <button type="submit" id="addBtn" class="btn btn-add">
            <i class="fas fa-plus"></i> Add
          </button>
        </div>
      </form>
    </section>

    <section class="controls-section" aria-label="Task controls">
      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <div class="search-wrapper">
        <i class="fas fa-search search-icon"></i>
        <input type="text" id="searchInput" placeholder="Search tasks..." autocomplete="off">
      </div>
      <button id="clearCompletedBtn" class="btn btn-clear" title="Clear completed tasks">
        <i class="fas fa-trash-alt"></i> Clear completed
      </button>
    </section>

    <section class="progress-section" aria-label="Progress">
      <div class="progress-header">
        <span>Progress</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill" style="width: 0%;"></div>
      </div>
    </section>

    <section class="task-list-section" aria-label="Task list">
      <ul id="taskList" class="task-list"></ul>
      <div id="emptyState" class="empty-state">
        <i class="fas fa-clipboard-list empty-icon"></i>
        <p>No tasks yet. Add one above!</p>
      </div>
    </section>
  </div>

  <script defer src="script.js"></script>
</body>
</html>
